@if (src()) {
  <div class="image-expandable {{ extraClass() }}">
    <div class="image-expandable-frame">
      <button
        type="button"
        class="image-expandable-media"
        (click)="enlarge.emit()"
        title="Enlarge image"
        [attr.aria-label]="'Enlarge ' + alt()"
      >
        <img [src]="src()" [alt]="alt()" draggable="false" />
      </button>
      <button
        type="button"
        class="image-expand-btn icon-action-button"
        (click)="enlarge.emit()"
        title="Enlarge image"
        [attr.aria-label]="'Enlarge ' + alt()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
          />
        </svg>
      </button>
    </div>
  </div>
}
