<button
  type="button"
  class="icon-action-button voice-mic-button"
  [class.is-listening]="listening"
  [disabled]="!supported || disabled()"
  [attr.aria-pressed]="listening"
  [attr.aria-label]="listening ? 'Stop listening' : supported ? 'Voice search' : 'Voice search unavailable'"
  [title]="
    !supported
      ? 'Voice search needs Chrome or Edge'
      : listening
        ? 'Listening… click to stop'
        : 'Speak your search'
  "
  (click)="toggle()"
>
  <svg class="icon-btn-svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
    <path
      fill="currentColor"
      d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"
    />
  </svg>
</button>
