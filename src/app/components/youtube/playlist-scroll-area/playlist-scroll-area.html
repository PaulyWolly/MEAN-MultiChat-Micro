<div
  #viewport
  class="playlist-scroll-area__viewport"
  [class]="viewportClass()"
  [attr.aria-label]="ariaLabel() || null"
>
  <ng-content />
</div>
<div
  class="playlist-scroll-area__rail"
  aria-hidden="true"
  (pointerdown)="onRailPointerDown($event)"
>
  @if (thumbVisible()) {
    <div
      class="playlist-scroll-area__thumb"
      [style.top.px]="thumbTop()"
      [style.height.px]="thumbHeight()"
      (pointerdown)="onThumbPointerDown($event)"
      (pointermove)="onThumbPointerMove($event)"
      (pointerup)="endThumbDrag($event)"
      (pointercancel)="endThumbDrag($event)"
    ></div>
  }
</div>
